<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercury DotAi — Сброс пароля</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="bg-canvas" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="bg-grid" aria-hidden="true"></div>

<div class="auth-page">
  <div class="auth-columns" style="grid-template-columns:1fr">

    <div class="auth-right" style="justify-content:center">
      <div class="auth-card" style="max-width:420px;width:100%">

        <!-- LOGO -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px">
          <svg width="32" height="32" viewBox="0 0 56 56" fill="none">
            <defs>
              <radialGradient id="pg2" cx="38%" cy="32%" r="65%"><stop offset="0%" stop-color="#d0ccfa"/><stop offset="55%" stop-color="#8B83E0"/><stop offset="100%" stop-color="#3D3699"/></radialGradient>
              <radialGradient id="gw2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7F77DD" stop-opacity="0.25"/><stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/></radialGradient>
            </defs>
            <circle cx="28" cy="28" r="27" fill="url(#gw2)"/>
            <circle cx="28" cy="28" r="11" fill="url(#pg2)"/>
            <ellipse cx="23.5" cy="23" rx="4.2" ry="2.8" fill="rgba(255,255,255,0.22)" transform="rotate(-30,23.5,23)"/>
          </svg>
          <span style="font-size:18px;font-weight:600;color:var(--text-primary)">Mercury <span style="color:var(--accent-light)">DotAi</span></span>
        </div>

        <!-- VIEW: FORM -->
        <div id="view-form">
          <h2 style="font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text-primary)">Новый пароль</h2>
          <p style="font-size:13px;color:var(--text-secondary);margin-bottom:24px;line-height:1.6">
            Придумай новый пароль для своего аккаунта Mercury DotAi.
          </p>

          <form onsubmit="handleReset(event)" novalidate>
            <div class="field-group">
              <label class="field-label" for="new-pass">Новый пароль</label>
              <input class="field-input" id="new-pass" type="password" placeholder="••••••••"
                     oninput="checkNewPass(this.value)" autocomplete="new-password"/>
              <p class="field-hint" id="new-pass-status"></p>
            </div>
            <div class="field-group">
              <label class="field-label" for="new-confirm">Повтор пароля</label>
              <input class="field-input" id="new-confirm" type="password" placeholder="••••••••"
                     oninput="checkNewConfirm(this.value)" autocomplete="new-password"/>
              <p class="field-hint" id="new-confirm-status"></p>
            </div>
            <button type="submit" class="btn-primary" id="reset-btn">Сохранить пароль</button>
          </form>
        </div>

        <!-- VIEW: SUCCESS -->
        <div id="view-success" style="display:none;text-align:center">
          <div style="font-size:48px;margin-bottom:16px">✅</div>
          <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text-primary)">Пароль обновлён!</h2>
          <p style="font-size:13px;color:var(--text-secondary);margin-bottom:24px;line-height:1.6">
            Теперь можешь войти с новым паролем.
          </p>
          <a href="/index.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none">
            Войти в Mercury DotAi
          </a>
        </div>

        <!-- VIEW: ERROR -->
        <div id="view-error" style="display:none;text-align:center">
          <div style="font-size:48px;margin-bottom:16px">❌</div>
          <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text-primary)">Ссылка недействительна</h2>
          <p style="font-size:13px;color:var(--text-secondary);margin-bottom:24px;line-height:1.6" id="error-desc">
            Ссылка истекла или уже была использована.
          </p>
          <a href="/index.html" class="btn-ghost" style="display:block;text-align:center;text-decoration:none">
            Запросить новую ссылку
          </a>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:3000/api';
let newPassValue = '';

// Get token from URL
const urlToken = new URLSearchParams(window.location.search).get('token');
if (!urlToken) showErrorView('Токен не найден. Перейдите по ссылке из письма.');

function showErrorView(msg) {
  document.getElementById('view-form').style.display = 'none';
  document.getElementById('view-success').style.display = 'none';
  document.getElementById('view-error').style.display = 'block';
  if (msg) document.getElementById('error-desc').textContent = msg;
}

function checkNewPass(val) {
  newPassValue = val;
  const el = document.getElementById('new-pass-status');
  if (!val) { el.textContent = ''; el.className = 'field-hint'; return; }
  if (val.length < 6) {
    el.textContent = 'Минимум 6 символов'; el.className = 'field-hint error';
  } else {
    el.textContent = '✓ Пароль подходит'; el.className = 'field-hint success';
    const c = document.getElementById('new-confirm');
    if (c.value) checkNewConfirm(c.value);
  }
}

function checkNewConfirm(val) {
  const el = document.getElementById('new-confirm-status');
  if (!val) { el.textContent = ''; el.className = 'field-hint'; return; }
  if (val !== newPassValue) {
    el.textContent = '✗ Пароли не совпадают'; el.className = 'field-hint error';
  } else {
    el.textContent = '✓ Пароли совпадают'; el.className = 'field-hint success';
  }
}

async function handleReset(e) {
  e.preventDefault();
  const pass    = document.getElementById('new-pass').value;
  const confirm = document.getElementById('new-confirm').value;

  if (!pass || !confirm) { showErr('Заполните все поля'); return; }
  if (pass.length < 6)   { showErr('Пароль минимум 6 символов'); return; }
  if (pass !== confirm)  { showErr('Пароли не совпадают'); return; }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Сохраняем...';

  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: urlToken, password: pass }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');

    document.getElementById('view-form').style.display = 'none';
    document.getElementById('view-success').style.display = 'block';

  } catch (err) {
    showErrorView(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить пароль';
  }
}

function showErr(msg) {
  let el = document.getElementById('reset-error');
  if (!el) {
    el = document.createElement('div');
    el.id = 'reset-error';
    el.style.cssText = 'background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:8px;padding:10px;color:#f87171;margin-bottom:12px;font-size:13px';
    document.querySelector('form').prepend(el);
  }
  el.textContent = msg;
  setTimeout(() => el?.remove(), 4000);
}
</script>
</body>
</html>
