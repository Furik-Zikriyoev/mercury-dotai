<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercury DotAi — ИИ-чат</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root {
      --bg:#080b11;--bg-card:#0f1420;--bg-hover:#141929;--bg-sidebar:#0b0e18;
      --border:rgba(127,119,221,0.18);--border-sub:rgba(255,255,255,0.06);
      --accent:#7F77DD;--accent-l:#AFA9EC;--accent-bg:rgba(127,119,221,0.1);
      --win:#4ade80;--lose:#f87171;--txt:#e8e6f8;--txt2:#9994c0;--txt3:#5f5c80;--txt4:#3a3760;
      --r-md:10px;--r-lg:16px;--nav-h:68px;--sidebar-w:260px;--shadow:0 4px 24px rgba(0,0,0,0.4);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;font-family:inherit;border:none;background:none}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes blink{0%,100%{opacity:0.2}50%{opacity:1}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @keyframes rotateLogo{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 5px rgba(127,119,221,0.5))}50%{filter:drop-shadow(0 0 16px rgba(127,119,221,1)) drop-shadow(0 0 28px rgba(127,119,221,0.4))}}
    .ai-spin{animation:rotateLogo 12s linear infinite,glowPulse 3s ease-in-out infinite;transform-origin:center}

    .orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:0.07;pointer-events:none;z-index:0}
    .o1{width:600px;height:600px;background:#534AB7;top:-150px;left:-150px}
    .o2{width:450px;height:450px;background:#3C3489;bottom:-100px;right:-100px}
    .bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:linear-gradient(rgba(127,119,221,0.03)1px,transparent 1px),
      linear-gradient(90deg,rgba(127,119,221,0.03)1px,transparent 1px);background-size:60px 60px}

    /* NAVBAR */
    .navbar{position:relative;z-index:10;height:var(--nav-h);flex-shrink:0;
      background:rgba(8,11,17,0.9);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px}
    .nav-logo{display:flex;align-items:center;gap:11px;flex-shrink:0;transition:opacity .2s;text-decoration:none}
    .nav-logo:hover{opacity:.85}
    .nav-logo-text{font-size:17px;font-weight:600;color:var(--txt)}
    .nav-logo-text .accent{color:var(--accent-l)}
    .nav-links{flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
    .nav-link{padding:7px 16px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;color:var(--txt2);transition:background .2s,color .2s;text-decoration:none}
    .nav-link:hover{background:rgba(255,255,255,0.05);color:var(--txt)}
    .nav-link.active{background:var(--accent-bg);color:var(--accent-l);border:1px solid rgba(127,119,221,0.22)}
    .nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
    .nav-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#534AB7,#7F77DD);
      display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;border:1.5px solid rgba(127,119,221,0.35)}
    .nav-divider{width:1px;height:22px;background:var(--border)}
    .nav-logout{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r-md);
      font-size:13px;font-weight:500;color:var(--lose);border:1px solid rgba(248,113,113,0.22);background:rgba(248,113,113,0.06)}
    .nav-logout:hover{background:rgba(248,113,113,0.12)}

    /* MAIN BODY */
    .body-wrap{position:relative;z-index:1;flex:1;display:flex;overflow:hidden}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);
      border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

    .sidebar-top{padding:16px 14px 12px;flex-shrink:0}

    .new-chat-btn{width:100%;display:flex;align-items:center;gap:8px;padding:10px 14px;
      border-radius:var(--r-md);background:linear-gradient(135deg,rgba(83,74,183,0.25),rgba(127,119,221,0.15));
      border:1px solid rgba(127,119,221,0.3);color:var(--accent-l);
      font-size:13px;font-weight:600;transition:background .2s,border-color .2s;letter-spacing:0.2px}
    .new-chat-btn:hover{background:linear-gradient(135deg,rgba(83,74,183,0.4),rgba(127,119,221,0.25));border-color:rgba(127,119,221,0.5)}
    .new-chat-btn svg{flex-shrink:0}

    .sidebar-label{font-size:10px;font-weight:700;color:var(--txt4);text-transform:uppercase;letter-spacing:1px;
      padding:10px 14px 6px;flex-shrink:0}

    .chat-list{flex:1;overflow-y:auto;padding:0 8px 12px;
      scrollbar-width:thin;scrollbar-color:rgba(127,119,221,0.15) transparent}
    .chat-list::-webkit-scrollbar{width:3px}
    .chat-list::-webkit-scrollbar-thumb{background:rgba(127,119,221,0.15);border-radius:2px}

    .chat-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
      cursor:pointer;transition:background .15s;position:relative;margin-bottom:2px}
    .chat-item:hover{background:rgba(255,255,255,0.04)}
    .chat-item.active{background:var(--accent-bg);border:1px solid rgba(127,119,221,0.22)}
    .chat-item-icon{font-size:15px;flex-shrink:0;width:22px;text-align:center}
    .chat-item-info{flex:1;min-width:0}
    .chat-item-title{font-size:12.5px;font-weight:500;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
    .chat-item.active .chat-item-title{color:var(--accent-l)}
    .chat-item-date{font-size:10px;color:var(--txt4);margin-top:2px}
    .chat-item-del{opacity:0;width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      border-radius:4px;transition:opacity .15s,background .15s;color:var(--txt4)}
    .chat-item:hover .chat-item-del{opacity:1}
    .chat-item-del:hover{background:rgba(248,113,113,0.12);color:var(--lose)}

    .sidebar-empty{padding:24px 14px;text-align:center;color:var(--txt4);font-size:12px;line-height:1.6}

    /* CHAT AREA */
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}

    .chat-header{padding:16px 24px 12px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--border-sub)}
    .chat-header-left{display:flex;align-items:center;gap:12px}
    .ai-avatar{width:38px;height:38px;border-radius:11px;
      background:linear-gradient(135deg,#534AB7,#7F77DD);
      display:flex;align-items:center;justify-content:center;font-size:18px;
      box-shadow:0 0 16px rgba(127,119,221,0.3);flex-shrink:0}
    .chat-header-name{font-size:15px;font-weight:700;color:var(--txt)}
    .chat-header-status{font-size:11px;color:var(--win);display:flex;align-items:center;gap:5px;margin-top:2px}
    .status-dot{width:6px;height:6px;border-radius:50%;background:var(--win);animation:blink 2s ease infinite}
    .header-actions{display:flex;align-items:center;gap:8px}
    .context-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(74,222,128,0.08);
      border:1px solid rgba(74,222,128,0.2);border-radius:20px;padding:3px 10px;
      font-size:11px;color:var(--win)}
    .icon-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-md);
      font-size:12px;font-weight:500;color:var(--txt3);border:1px solid var(--border);
      background:transparent;transition:background .15s,color .15s}
    .icon-btn:hover{background:rgba(255,255,255,0.05);color:var(--txt2)}

    /* MESSAGES */
    .messages{flex:1;overflow-y:auto;padding:16px 24px 12px;display:flex;flex-direction:column;gap:16px;
      scrollbar-width:thin;scrollbar-color:rgba(127,119,221,0.2) transparent}
    .messages::-webkit-scrollbar{width:4px}
    .messages::-webkit-scrollbar-track{background:transparent}
    .messages::-webkit-scrollbar-thumb{background:rgba(127,119,221,0.2);border-radius:2px}

    /* WELCOME */
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;
      flex:1;text-align:center;padding:30px 0;animation:fadeUp .4s ease}
    .welcome-icon{font-size:44px;margin-bottom:14px}
    .welcome-title{font-size:20px;font-weight:700;margin-bottom:7px}
    .welcome-sub{font-size:13.5px;color:var(--txt3);line-height:1.6;max-width:400px;margin-bottom:24px}
    .quick-prompts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:580px}
    .quick-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);
      padding:11px 14px;text-align:left;font-size:13px;color:var(--txt2);
      transition:background .2s,border-color .2s,color .2s;cursor:pointer;line-height:1.4}
    .quick-btn:hover{background:var(--bg-hover);border-color:rgba(127,119,221,0.35);color:var(--txt)}
    .quick-btn-icon{font-size:17px;margin-bottom:5px;display:block}
    .quick-btn-text{font-size:11px;color:var(--txt4);margin-top:3px;display:block}

    /* MESSAGE BUBBLE */
    .msg{display:flex;gap:10px;animation:fadeUp .25s ease}
    .msg.user{flex-direction:row-reverse}
    .msg-avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
    .msg-avatar.ai{background:linear-gradient(135deg,#534AB7,#7F77DD);font-size:15px}
    .msg-avatar.user{background:rgba(127,119,221,0.15);border:1px solid rgba(127,119,221,0.3);color:var(--accent-l)}
    .msg-body{max-width:78%;display:flex;flex-direction:column;gap:4px}
    .msg.user .msg-body{align-items:flex-end}
    .msg-bubble{padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.7;word-break:break-word}
    .msg.ai .msg-bubble{background:var(--bg-card);border:1px solid var(--border);color:var(--txt2);border-radius:4px 16px 16px 16px}
    .msg.user .msg-bubble{background:linear-gradient(135deg,rgba(83,74,183,0.4),rgba(127,119,221,0.3));border:1px solid rgba(127,119,221,0.3);color:var(--txt);border-radius:16px 4px 16px 16px}
    .msg-bubble strong,.msg-bubble b{color:var(--txt);font-weight:600}
    .msg-bubble p{margin-bottom:8px}
    .msg-bubble p:last-child{margin-bottom:0}
    .msg-time{font-size:10px;color:var(--txt4);padding:0 4px}

    /* TYPING */
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-l);display:inline-block}
    .typing-dot:nth-child(1){animation:blink 1.2s ease infinite}
    .typing-dot:nth-child(2){animation:blink 1.2s ease .2s infinite}
    .typing-dot:nth-child(3){animation:blink 1.2s ease .4s infinite}

    /* INPUT */
    .input-area{flex-shrink:0;padding:10px 24px 18px;border-top:1px solid var(--border-sub)}
    .input-wrap{display:flex;gap:10px;align-items:flex-end}
    .chat-input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);
      padding:11px 15px;font-size:14px;color:var(--txt);outline:none;resize:none;
      font-family:inherit;line-height:1.5;max-height:120px;transition:border-color .2s;scrollbar-width:thin}
    .chat-input::placeholder{color:var(--txt4)}
    .chat-input:focus{border-color:rgba(127,119,221,0.45)}
    .send-btn{width:40px;height:40px;border-radius:var(--r-md);flex-shrink:0;
      background:linear-gradient(135deg,#534AB7,#7F77DD);color:#fff;
      display:flex;align-items:center;justify-content:center;
      transition:opacity .2s,transform .1s;border:none;cursor:pointer}
    .send-btn:hover{opacity:.9}
    .send-btn:active{transform:scale(.95)}
    .send-btn:disabled{opacity:.4;cursor:default}
    .input-hint{font-size:11px;color:var(--txt4);margin-top:7px;text-align:center}
  </style>
</head>

<div class="body-wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

      <div class="chat-header-left">
        <div class="ai-avatar" style="background:none;box-shadow:none;padding:0;overflow:visible"><svg class="ai-spin" width="42" height="42" viewBox="0 0 56 56" fill="none"><defs><radialGradient id="aipg" cx="38%" cy="32%" r="65%"><stop offset="0%" stop-color="#d0ccfa"/><stop offset="55%" stop-color="#8B83E0"/><stop offset="100%" stop-color="#3D3699"/></radialGradient><radialGradient id="aigw" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7F77DD" stop-opacity="0.4"/><stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/></radialGradient></defs><circle cx="28" cy="28" r="27" fill="url(#aigw)"/><circle cx="28" cy="28" r="22" fill="none" stroke="rgba(127,119,221,0.3)" stroke-width="0.8"/><circle cx="28" cy="6" r="2.2" fill="#AFA9EC"/><circle cx="50" cy="28" r="2.2" fill="#AFA9EC"/><circle cx="28" cy="50" r="2.2" fill="#AFA9EC"/><circle cx="6" cy="28" r="2.2" fill="#AFA9EC"/><circle cx="43.6" cy="11.4" r="1.6" fill="#7F77DD" opacity="0.85"/><circle cx="43.6" cy="44.6" r="1.6" fill="#7F77DD" opacity="0.85"/><circle cx="12.4" cy="44.6" r="1.6" fill="#7F77DD" opacity="0.85"/><circle cx="12.4" cy="11.4" r="1.6" fill="#7F77DD" opacity="0.85"/><line x1="28" y1="8.2" x2="42" y2="13" stroke="rgba(127,119,221,0.6)" stroke-width="0.8" stroke-linecap="round"/><line x1="44.8" y1="13" x2="48.2" y2="26" stroke="rgba(127,119,221,0.6)" stroke-width="0.8" stroke-linecap="round"/><line x1="48.2" y1="30" x2="44.8" y2="43" stroke="rgba(127,119,221,0.6)" stroke-width="0.8" stroke-linecap="round"/><line x1="42" y1="43" x2="28" y2="47.8" stroke="rgba(127,119,221,0.6)" stroke-width="0.8" stroke-linecap="round"/><line x1="14" y1="43" x2="7.8" y2="30" stroke="rgba(127,119,221,0.6)" stroke-width="0.8" stroke-linecap="round"/><line x1="7.8" y1="26" x2="14" y2="13" stroke="rgba(127,119,221,0.6)" stroke-width="0.8" stroke-linecap="round"/><line x1="24" y1="47.8" x2="13" y2="43" stroke="rgba(127,119,221,0.6)" stroke-width="0.8" stroke-linecap="round"/><circle cx="28" cy="28" r="11" fill="url(#aipg)"/><ellipse cx="23.5" cy="23" rx="4.2" ry="2.8" fill="rgba(255,255,255,0.22)" transform="rotate(-30,23.5,23)"/><circle cx="28" cy="28" r="13.5" fill="none" stroke="rgba(175,169,236,0.35)" stroke-width="0.7"/></svg></div>

        <button class="icon-btn" onclick="newChat()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Новый чат
        </button>
        <button class="icon-btn" id="clear-btn" onclick="clearCurrentChat()" style="display:none">

    <div class="messages" id="messages">

    <div class="input-area">
      <div class="input-wrap">
        <textarea class="chat-input" id="chat-input" placeholder="Спроси про героя, механику или попроси совет..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter — отправить · Shift+Enter — новая строка</div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:3000/api';
const SESSIONS_KEY = 'mercury_chat_sessions';   // {[id]: {id, title, ts, messages[]}}
const CURRENT_KEY  = 'mercury_chat_current';    // current session id
const MAX_HISTORY  = 40;
const MAX_SESSIONS = 30;

let currentSessionId = null;
let messages = [];
let isLoading = false;
let playerContext = null;
let heroMetaMap = {};

// ── utils ─────────────────────────────────────────────────────────
function handleLogout(){ localStorage.clear(); window.location.href='/index.html'; }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } }
function timeStr(){ return new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}); }
function dateLabel(ts){
  const d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return 'Сегодня';
  const yest=new Date(now); yest.setDate(yest.getDate()-1);
  if(d.toDateString()===yest.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru',{day:'numeric',month:'short'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function scrollToBottom(){ const el=document.getElementById('messages'); setTimeout(()=>el.scrollTo({top:el.scrollHeight,behavior:'smooth'}),50); }

// ── session storage ───────────────────────────────────────────────
function getSessions(){
  try{ return JSON.parse(localStorage.getItem(SESSIONS_KEY)||'{}'); }catch(e){ return {}; }
}
function saveSessions(s){ try{ localStorage.setItem(SESSIONS_KEY,JSON.stringify(s)); }catch(e){} }

function saveCurrentSession(){
  if(!currentSessionId) return;
  const sessions=getSessions();
  const sess=sessions[currentSessionId];
  if(!sess) return;
  sess.messages=messages.slice(-MAX_HISTORY);
  sess.ts=Date.now();
  // Update title from first user message if still default
  if(sess.title==='Новый чат' && messages.length>0){
    const firstUser=messages.find(m=>m.role==='user');
    if(firstUser) sess.title=firstUser.content.slice(0,38)+(firstUser.content.length>38?'…':'');
  }
  sessions[currentSessionId]=sess;
  saveSessions(sessions);
}

function createSession(){
  const id=uid();
  const sessions=getSessions();
  sessions[id]={id, title:'Новый чат', ts:Date.now(), messages:[]};
  // trim old sessions
  const keys=Object.keys(sessions).sort((a,b)=>sessions[b].ts-sessions[a].ts);
  if(keys.length>MAX_SESSIONS) keys.slice(MAX_SESSIONS).forEach(k=>delete sessions[k]);
  saveSessions(sessions);
  return id;
}

function deleteSession(id){
  const sessions=getSessions();
  delete sessions[id];
  saveSessions(sessions);
  if(currentSessionId===id){
    const remaining=Object.keys(sessions);
    if(remaining.length>0){
      const latest=remaining.sort((a,b)=>sessions[b].ts-sessions[a].ts)[0];
      loadSession(latest);
    } else {
      newChat();
    }
  }
  renderSidebar();
}

function loadSession(id){
  saveCurrentSession();
  const sessions=getSessions();
  const sess=sessions[id];
  if(!sess) return;
  currentSessionId=id;
  localStorage.setItem(CURRENT_KEY,id);
  messages=sess.messages||[];
  renderMessages();
  renderSidebar();
  document.getElementById('clear-btn').style.display=messages.length?'flex':'none';
}

// ── sidebar render ────────────────────────────────────────────────
function renderSidebar(){
  const list=document.getElementById('chat-list');
  const sessions=getSessions();
  const sorted=Object.values(sessions).sort((a,b)=>b.ts-a.ts);
  if(!sorted.length){
    list.innerHTML='<div class="sidebar-empty">Чаты появятся здесь после первого сообщения</div>';
    return;
  }
  list.innerHTML=sorted.map(s=>{
    const active=s.id===currentSessionId?'active':'';
    const icon=getSessionIcon(s.title);
    return `<div class="chat-item ${active}" onclick="loadSession('${s.id}')">
      <span class="chat-item-icon">${icon}</span>
      <div class="chat-item-info">
        <div class="chat-item-title">${escHtml(s.title)}</div>
        <div class="chat-item-date">${dateLabel(s.ts)}</div>
      </div>
      <button class="chat-item-del" onclick="event.stopPropagation();deleteSession('${s.id}')" title="Удалить">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join('');
}

function getSessionIcon(title){
  const t=title.toLowerCase();
  if(t.includes('invoker')||t.includes('инвокер')) return '🔮';
  if(t.includes('герой')||t.includes('hero')||t.includes('играть на')) return '⚔️';
  if(t.includes('мета')||t.includes('патч')||t.includes('топ')) return '🏆';
  if(t.includes('стак')||t.includes('пул')||t.includes('фарм')) return '🌲';
  if(t.includes('стат')||t.includes('анализ')||t.includes('разбор')) return '📊';
  if(t.includes('предмет')||t.includes('билд')||t.includes('item')) return '🎒';
  if(t.includes('гайд')||t.includes('guide')||t.includes('учи')) return '📖';
  return '💬';
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── new chat / clear ──────────────────────────────────────────────
function newChat(){
  saveCurrentSession();
  const id=createSession();
  currentSessionId=id;
  localStorage.setItem(CURRENT_KEY,id);
  messages=[];
  showWelcome();
  renderSidebar();
  document.getElementById('clear-btn').style.display='none';
  document.getElementById('chat-input').focus();
}

function clearCurrentChat(){
  if(!confirm('Очистить историю этого чата?')) return;
  messages=[];
  saveCurrentSession();
  showWelcome();
  document.getElementById('clear-btn').style.display='none';
}

// ── welcome screen ────────────────────────────────────────────────
function showWelcome(){
  const msgs=document.getElementById('messages');
  msgs.innerHTML=`<div class="welcome" id="welcome">
    <div class="welcome-icon">⚔️</div>
    <div class="welcome-title">Mercury AI — твой Dota 2 коуч</div>
    <div class="welcome-sub">Спроси про любого героя, механику игры, билд предметов или попроси разобрать твой стиль игры</div>
    <div class="quick-prompts">
      <button class="quick-btn" onclick="quickSend('Как научиться играть на Invoker? С чего начать?')">
        <span class="quick-btn-icon">🔮</span>Как играть на Invoker
        <span class="quick-btn-text">Способности, билд, советы</span>
      </button>
      <button class="quick-btn" onclick="quickSend('Какие герои сейчас сильнее всего в мете?')">
        <span class="quick-btn-icon">🏆</span>Мета сейчас
        <span class="quick-btn-text">Топ герои патча</span>
      </button>
      <button class="quick-btn" onclick="quickSend('Объясни механику стакинга и пулинга лагеря нейтралов')">
        <span class="quick-btn-icon">🌲</span>Стакинг и пулинг
        <span class="quick-btn-text">Механика фарма</span>
      </button>
      <button class="quick-btn" onclick="sendWithContext()">
        <span class="quick-btn-icon">📊</span>Разбери мою статистику
        <span class="quick-btn-text">Персональные советы</span>
      </button>
      <button class="quick-btn" onclick="quickSend('Как правильно делать варды и контрварды? Где ставить?')">
        <span class="quick-btn-icon">🗺️</span>Варды и карта
        <span class="quick-btn-text">Видение и контроль карты</span>
      </button>
      <button class="quick-btn" onclick="quickSend('Как улучшить механику last hit? Советы для новичка')">
        <span class="quick-btn-icon">⚡</span>Last hit механика
        <span class="quick-btn-text">Фарм и CS советы</span>
      </button>
      <button class="quick-btn" onclick="quickSend('Расскажи про Roshan — когда брать, как контролировать?')">
        <span class="quick-btn-icon">🔴</span>Рошан и объекты
        <span class="quick-btn-text">Тайминги и приоритеты</span>
      </button>
      <button class="quick-btn" onclick="quickSend('Как играть Carry на поздней стадии игры (late game)?')">
        <span class="quick-btn-icon">🏹</span>Late game Carry
        <span class="quick-btn-text">Позиция и решения</span>
      </button>
    </div>
  </div>`;
}

// ── render messages ────────────────────────────────────────────────
function renderMessages(){
  const msgs=document.getElementById('messages');
  if(!messages.length){ showWelcome(); return; }
  msgs.innerHTML='';
  messages.forEach(m=>appendMessageDOM(m.role,m.content));
  scrollToBottom();
}

function appendMessageDOM(role, content){
  const welcome=document.getElementById('welcome');
  if(welcome) welcome.remove();

  const msgs=document.getElementById('messages');
  const isUser=role==='user';
  const user=JSON.parse(localStorage.getItem('user')||'{}');
const steamAv=localStorage.getItem('steam_avatar');
const initials=steamAv
  ? `<img src="${steamAv}" style="width:100%;height:100%;object-fit:cover;border-radius:9px">`
  : (user.login||'?').slice(0,2).toUpperCase();
  const div=document.createElement('div');
  div.className=`msg ${role}`;
  div.innerHTML=`
    <div class="msg-avatar ${role}" style="${isUser?'':'background:none;padding:0;overflow:visible'}">${isUser?initials:`<svg class="ai-spin" width="20" height="20" viewBox="0 0 56 56" fill="none"><defs><radialGradient id="msgpg" cx="38%" cy="32%" r="65%"><stop offset="0%" stop-color="#d0ccfa"/><stop offset="55%" stop-color="#8B83E0"/><stop offset="100%" stop-color="#3D3699"/></radialGradient></defs><circle cx="28" cy="28" r="27" fill="rgba(127,119,221,0.15)"/><circle cx="28" cy="6" r="2.2" fill="#AFA9EC"/><circle cx="50" cy="28" r="2.2" fill="#AFA9EC"/><circle cx="28" cy="50" r="2.2" fill="#AFA9EC"/><circle cx="6" cy="28" r="2.2" fill="#AFA9EC"/><line x1="28" y1="8.2" x2="42" y2="13" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="44.8" y1="13" x2="48.2" y2="26" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="48.2" y1="30" x2="44.8" y2="43" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="42" y1="43" x2="28" y2="47.8" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="14" y1="43" x2="7.8" y2="30" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="7.8" y1="26" x2="14" y2="13" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><circle cx="28" cy="28" r="11" fill="url(#msgpg)"/><ellipse cx="23.5" cy="23" rx="4.2" ry="2.8" fill="rgba(255,255,255,0.22)" transform="rotate(-30,23.5,23)"/></svg>`}</div>
    <div class="msg-body">
      <div class="msg-bubble">${isUser?escHtml(content):renderAIResponse(content)}</div>
      <div class="msg-time">${timeStr()}</div>
    </div>`;
  msgs.appendChild(div);
  scrollToBottom();
}

function addMessage(role, content, save=true){
  appendMessageDOM(role, content);
  if(save){
    const contentToStore = typeof content==='object'?JSON.stringify(content):content;
    messages.push({role, content: contentToStore});
    if(messages.length>MAX_HISTORY) messages=messages.slice(-MAX_HISTORY);
    saveCurrentSession();
    renderSidebar();
    document.getElementById('clear-btn').style.display='flex';
  }
}

// ── typing indicator ──────────────────────────────────────────────
function showTyping(){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  div.className='msg ai'; div.id='typing-indicator';
  div.innerHTML=`<div class="msg-avatar ai" style="background:none;padding:0;overflow:visible"><svg class="ai-spin" width="20" height="20" viewBox="0 0 56 56" fill="none"><defs><radialGradient id="msgpg" cx="38%" cy="32%" r="65%"><stop offset="0%" stop-color="#d0ccfa"/><stop offset="55%" stop-color="#8B83E0"/><stop offset="100%" stop-color="#3D3699"/></radialGradient></defs><circle cx="28" cy="28" r="27" fill="rgba(127,119,221,0.15)"/><circle cx="28" cy="6" r="2.2" fill="#AFA9EC"/><circle cx="50" cy="28" r="2.2" fill="#AFA9EC"/><circle cx="28" cy="50" r="2.2" fill="#AFA9EC"/><circle cx="6" cy="28" r="2.2" fill="#AFA9EC"/><line x1="28" y1="8.2" x2="42" y2="13" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="44.8" y1="13" x2="48.2" y2="26" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="48.2" y1="30" x2="44.8" y2="43" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="42" y1="43" x2="28" y2="47.8" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="14" y1="43" x2="7.8" y2="30" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><line x1="7.8" y1="26" x2="14" y2="13" stroke="rgba(127,119,221,0.6)" stroke-width="1" stroke-linecap="round"/><circle cx="28" cy="28" r="11" fill="url(#msgpg)"/><ellipse cx="23.5" cy="23" rx="4.2" ry="2.8" fill="rgba(255,255,255,0.22)" transform="rotate(-30,23.5,23)"/></svg></div>
    <div class="msg-body"><div class="msg-bubble" style="padding:14px 18px">
      <span class="typing-dot"></span><span class="typing-dot" style="margin:0 3px"></span><span class="typing-dot"></span>
    </div></div>`;
  msgs.appendChild(div); scrollToBottom();
}
function removeTyping(){ const t=document.getElementById('typing-indicator'); if(t)t.remove(); }

// ── send ──────────────────────────────────────────────────────────
function quickSend(text){ document.getElementById('chat-input').value=text; sendMessage(); }
function sendWithContext(){
  document.getElementById('chat-input').value='Посмотри мою статистику и скажи что мне стоит улучшить в первую очередь';
  sendMessage();
}

async function sendMessage(){
  if(isLoading) return;
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text) return;
  input.value=''; input.style.height='auto';
  addMessage('user',text);
  isLoading=true;
  document.getElementById('send-btn').disabled=true;
  showTyping();
  const token=localStorage.getItem('token');
  try{
    const res=await fetch(`${API}/ai/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({messages,playerContext}),
    });
    const data=await res.json();
    removeTyping();
    if(!res.ok) throw new Error(data.error||'Ошибка сервера');
    // Use parsed object if available, else try to parse message string
    let msgContent = data.parsed;
    if(!msgContent && data.message){
      try{ msgContent=JSON.parse(data.message); }catch(e){ msgContent=data.message; }
    }
    addMessage('assistant', msgContent||'Пустой ответ');
  }catch(e){
    removeTyping();
    addMessage('assistant','❌ Ошибка: '+e.message+'. Проверьте что сервер запущен.');
  }
  isLoading=false;
  document.getElementById('send-btn').disabled=false;
  input.focus();
}

// ── AI rendering ──────────────────────────────────────────────────
const ITEMS_CDN='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/';
const HEROES_CDN='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/';
const ITEM_MAP={'hand of midas':'hand_of_midas','boots of travel':'travel_boots','travel boots':'travel_boots',"eul's scepter":"cyclone","aghanim's scepter":"ultimate_scepter","black king bar":"black_king_bar",'bkb':'black_king_bar',"octarine core":"octarine_core","scythe of vyse":"sheepstick","refresher orb":"refresher","blink dagger":"blink","force staff":"force_staff","null talisman":"null_talisman","iron branch":"branches","tango":"tango","faerie fire":"faerie_fire","mantle of intelligence":"mantle","manta style":"manta","battle fury":"bfury","desolator":"desolator","maelstrom":"maelstrom","mjollnir":"mjollnir","monkey king bar":"monkey_king_bar","daedalus":"greater_crit","butterfly":"butterfly","satanic":"satanic","assault cuirass":"assault","heart of tarrasque":"heart","abyssal blade":"abyssal_blade","shadow blade":"invis_sword","silver edge":"silver_edge","linken's sphere":"sphere","linkens":"sphere","pipe of insight":"pipe","hood of defiance":"hood","crimson guard":"crimson_guard","guardian greaves":"guardian_greaves","vladmir's offering":"vladmir","mekansm":"mekansm","arcane boots":"arcane_boots","phase boots":"phase_boots","power treads":"power_treads","magic wand":"magic_wand","urn of shadows":"urn_of_shadows","spirit vessel":"spirit_vessel","vanguard":"vanguard","blade mail":"blade_mail","dragon lance":"dragon_lance","hurricane pike":"hurricane_pike","yasha":"yasha","sange":"sange","kaya":"kaya","meteor hammer":"meteor_hammer","aether lens":"aether_lens","soul ring":"soul_ring","bottle":"bottle","clarity":"clarity","radiance":"radiance","skull basher":"skull_basher","magic stick":"magic_stick","bracer":"bracer","wraith band":"wraith_band","quelling blade":"quelling_blade","echo sabre":"echo_sabre","gleipnir":"gleipnir"};
function itemKey(n){ return ITEM_MAP[n.toLowerCase()]||null; }
function itemChip(name){ const k=itemKey(name); const img=k?`<img src="${ITEMS_CDN}${k}.png" style="width:32px;height:24px;border-radius:4px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`:'' ; return `<span style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:3px 8px;font-size:12px;color:#e8e6f8;white-space:nowrap">${img}${name}</span>`; }
function heroImgUrl(heroName){ const e=Object.values(heroMetaMap).find(h=>h.name.toLowerCase()===heroName.toLowerCase()); return e?`${HEROES_CDN}${e.img}.png`:null; }
function heroKey(name){ return name.toLowerCase().replace(/['-]/g,'_').replace(/ /g,'_').replace(/__/g,'_'); }
function heroChip(name){
  const imgKey=heroKey(name);
  const entry=Object.values(heroMetaMap).find(h=>h.name.toLowerCase()===name.toLowerCase());
  const imgSrc=entry?`${HEROES_CDN}${entry.img}.png`:`${HEROES_CDN}${imgKey}.png`;
  return `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(127,119,221,0.08);border:1px solid rgba(127,119,221,0.22);border-radius:6px;padding:3px 9px;font-size:12px;color:#AFA9EC;white-space:nowrap"><img src="${imgSrc}" style="width:28px;height:20px;border-radius:3px;object-fit:cover;object-position:center top;flex-shrink:0" onerror="this.style.display='none'">${name}</span>`;
}
function renderChips(items, heroes){
  let html='';
  if(items&&items.length) html+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px">${items.map(n=>itemChip(n)).join('')}</div>`;
  if(heroes&&heroes.length) html+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${heroes.map(n=>heroChip(n)).join('')}</div>`;
  return html;
}

function renderAIResponse(raw){
  let data;
  try{
    if(raw && typeof raw === 'object'){ data = raw; }
    else if(typeof raw === 'string'){
      const trimmed = raw.trim();
      try{ data = JSON.parse(trimmed); }
      catch(e){
        const m = trimmed.match(/\{[\s\S]*\}/);
        if(m) data = JSON.parse(m[0]);
        else throw new Error('no json');
      }
    } else { throw new Error('bad input'); }
  }catch(e){ return renderPlainText(typeof raw==='string'?raw:JSON.stringify(raw)); }
  if(!data || !data.type) return renderPlainText(typeof raw==='string'?raw:JSON.stringify(raw));
  if(data.type==='hero') return renderHeroResponse(data);
  if(data.type==='general') return renderGeneralResponse(data);
  return renderPlainText(typeof raw==='string'?raw:JSON.stringify(raw));
}
function renderHeroResponse(data){
  const AC={str:'#f87171',agi:'#4ade80',int:'#60a5fa',uni:'#c084fc'};
  const AN={str:'Сила',agi:'Ловкость',int:'Интеллект',uni:'Универсал'};
  const attr=data.attr||'str';
  const imgUrl=heroImgUrl(data.hero)||`${HEROES_CDN}${(data.hero||'').toLowerCase().replace(/ /g,'_')}.png`;
  let h=`<div style="margin-bottom:16px">`;
  h+=`<div style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;margin-bottom:16px">`;
  if(imgUrl) h+=`<img src="${imgUrl}" style="width:64px;height:64px;border-radius:12px;object-fit:cover;object-position:center top;flex-shrink:0" onerror="this.style.display='none'">`;
  h+=`<div><div style="font-size:18px;font-weight:800;color:#e8e6f8">${data.heroRu||data.hero}</div>
    <div style="display:flex;gap:8px;margin-top:5px;align-items:center">
      <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:${AC[attr]}20;color:${AC[attr]};border:1px solid ${AC[attr]}40">${AN[attr]||attr}</span>
      ${data.role?`<span style="font-size:11px;color:#5f5c80">${data.role}</span>`:''}
    </div></div></div>`;
  (data.sections||[]).forEach(sec=>{
    h+=`<div style="margin-bottom:14px">`;
    h+=`<div style="font-size:12px;font-weight:700;color:#AFA9EC;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(127,119,221,0.15)">${sec.title}</div>`;
    (sec.items||[]).forEach(item=>{
      h+=`<div style="margin-bottom:10px"><p style="font-size:13px;color:#9994c0;line-height:1.65;margin-bottom:4px">${(item.text||'').replace(/\*\*(.*?)\*\*/g,'<strong style="color:#e8e6f8">$1</strong>')}</p>`;
      h+=renderChips(item.items, item.heroes);
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`; return h;
}
function renderGeneralResponse(data){
  let h='';
  (data.sections||[]).forEach((sec,i)=>{
    h+=`<div style="margin-bottom:18px">`;
    h+=`<div style="display:flex;align-items:center;gap:9px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid rgba(127,119,221,0.12)">
      <span style="min-width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,rgba(83,74,183,0.35),rgba(127,119,221,0.2));border:1px solid rgba(127,119,221,0.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#AFA9EC;flex-shrink:0">${i+1}</span>
      <span style="font-size:13.5px;font-weight:700;color:#e8e6f8;letter-spacing:0.2px">${sec.title}</span>
    </div>`;
    (sec.items||[]).forEach(item=>{
      const txt=(item.text||'').replace(/\*\*(.*?)\*\*/g,'<strong style="color:#e8e6f8">$1</strong>');
      h+=`<div style="display:flex;gap:9px;margin-bottom:12px;padding-left:4px">
        <span style="color:#7F77DD;flex-shrink:0;margin-top:3px;font-size:15px">›</span>
        <div style="flex:1">
          <p style="font-size:13px;color:#9994c0;line-height:1.7;margin-bottom:0">${txt}</p>
          ${renderChips(item.items, item.heroes)}
        </div>
      </div>`;
    });
    h+=`</div>`;
  });
  return h;
}
function renderPlainText(text){
  return text.replace(/\*\*(.*?)\*\*/g,'<strong style="color:#e8e6f8">$1</strong>')
    .split('\n').filter(l=>l.trim())
    .map(l=>`<p style="font-size:13px;color:#9994c0;line-height:1.7;margin-bottom:6px">${l}</p>`).join('');
}

// ── player context ────────────────────────────────────────────────
function loadPlayerContext(){
  try{
    const steamId=localStorage.getItem('steam_id');
    if(!steamId) return null;
    const id32=Number(BigInt(steamId)-76561197960265728n);
    const cached=JSON.parse(localStorage.getItem(`mercury_cache_${id32}`)||'null');
    if(!cached?.data) return null;
    const d=cached.data; const wl=d.wl||{}; const total=(wl.win||0)+(wl.lose||0);
    const wr=total>0?((wl.win||0)/total*100).toFixed(1):0;
    const recent=d.recent||[]; const n=recent.length||1;
    const avgK=recent.reduce((s,m)=>s+(m.kills||0),0)/n;
    const avgD=recent.reduce((s,m)=>s+(m.deaths||0),0)/n;
    const avgA=recent.reduce((s,m)=>s+(m.assists||0),0)/n;
    const kda=avgD>0?((avgK+avgA)/avgD).toFixed(2):'∞';
    const avgGpm=Math.round(recent.filter(m=>m.gold_per_min).reduce((s,m)=>s+(m.gold_per_min||0),0)/Math.max(recent.filter(m=>m.gold_per_min).length,1));
    const avgXpm=Math.round(recent.filter(m=>m.xp_per_min).reduce((s,m)=>s+(m.xp_per_min||0),0)/Math.max(recent.filter(m=>m.xp_per_min).length,1));
    const ROLE_NAMES={1:'Carry',2:'Mid',3:'Offlane',4:'Support',5:'Hard Support'};
    const roleCounts={};
    (d.matches||[]).forEach(m=>{ if(m.lane_role>0) roleCounts[m.lane_role]=(roleCounts[m.lane_role]||0)+1; });
    const roles=Object.entries(roleCounts).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([r])=>ROLE_NAMES[r]||'?').join(', ')||'неизвестно';
    let topHeroes='нет данных';
    const heroCache=JSON.parse(localStorage.getItem('mercury_heroes_cache')||'null');
    if(heroCache?.data){ const top=heroCache.data.filter(h=>h.games>0).sort((a,b)=>b.games-a.games).slice(0,3); topHeroes=top.map(h=>h.name+' ('+h.games+' игр, '+Math.round(h.wr||0)+'% WR)').join(', '); }
    return {winrate:wr,kda,totalMatches:total,gpm:avgGpm,xpm:avgXpm,roles,topHeroes};
  }catch(e){ return null; }
}

// ── init ──────────────────────────────────────────────────────────
async function init(){
  const token=localStorage.getItem('token');
  const userRaw=localStorage.getItem('user');
  if(!token||!userRaw){window.location.href='/index.html';return;}
  const user=JSON.parse(userRaw);
  document.getElementById('nav-username').textContent=user.login;
  document.getElementById('nav-avatar').textContent=user.login.slice(0,2).toUpperCase();

  playerContext=loadPlayerContext();
  if(playerContext) document.getElementById('context-badge').style.display='inline-flex';

  // Load hero meta
  try{ const r=await fetch('https://api.opendota.com/api/heroes'); if(r.ok){const hs=await r.json();hs.forEach(h=>{heroMetaMap[h.id]={name:h.localized_name,img:(h.name||'').replace('npc_dota_hero_','')};});} }catch(e){}

  // Restore or create session
  const sessions=getSessions();
  const savedCurrent=localStorage.getItem(CURRENT_KEY);
  if(savedCurrent && sessions[savedCurrent]){
    currentSessionId=savedCurrent;
    messages=sessions[savedCurrent].messages||[];
  } else {
    // Always start with welcome (new session)
    currentSessionId=createSession();
    localStorage.setItem(CURRENT_KEY,currentSessionId);
    messages=[];
  }

  // Always show welcome on page open regardless of history
  showWelcome();
  // But if session has messages, render them below welcome... actually spec: always show welcome on open
  // If user wants to go back to old chat they click sidebar
  if(messages.length){
    // render the actual messages (welcome will be replaced by first addMessage)
    renderMessages();
    document.getElementById('clear-btn').style.display='flex';
  }

  renderSidebar();
  document.getElementById('chat-input').focus();
}

document.addEventListener('DOMContentLoaded',init);
</script>
